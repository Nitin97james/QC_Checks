<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Warehouse Checks</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;-webkit-font-smoothing:antialiased}
  button{cursor:pointer;font-family:inherit;transition:opacity .15s}
  button:active{opacity:.7}
  input{font-family:inherit}
  .scroll-x{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .scroll-x::-webkit-scrollbar{display:none}
  #app{max-width:430px;margin:0 auto;min-height:100vh;background:#f1f5f9}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
// ── Firebase ──────────────────────────────────────────────────
let db = null, firebaseReady = false;
try {
  firebase.initializeApp({
    apiKey:"AIzaSyBHtoHnyGhYZmTkAnmS328lm6udcYGHIYU",
    databaseURL:"https://warehouse-checks-default-rtdb.firebaseio.com",
  });
  db = firebase.database();
  firebaseReady = true;
} catch(e) { console.warn("Firebase init failed", e); }

// ── config ────────────────────────────────────────────────────
const SITES=["Fuji","Koi","Bonsai","Yuzu"];
const SITE_CFG={
  Fuji:  {color:"#185FA5",bg:"#dbeafe",abbr:"FU"},
  Koi:   {color:"#993C1D",bg:"#fee2e2",abbr:"KO"},
  Bonsai:{color:"#0F6E56",bg:"#d1fae5",abbr:"BO"},
  Yuzu:  {color:"#854F0B",bg:"#fef3c7",abbr:"YU"},
};
const CHECK_CFG={
  mice:   {label:"Mice activity"},
  nozzle: {label:"Nozzle check"},
  temp:   {label:"Temperature"},
  shutter:{label:"Shutter door"},
};
const SHUTTER=[4,5,6,7,8,9,10];
const SCH={
  Fuji:{
    mice:   [6,8,10,12,14,16,18,20,22],
    nozzle: Array.from({length:19},(_,i)=>i+4),
    temp:   [4,8,12,16,20,22],
    shutter:SHUTTER,
  },
  Koi:{
    mice:   [6,8,10,12,14,16,18,20,22],
    temp:   [4,8,12,16,20,22],
    shutter:SHUTTER,
  },
  Bonsai:{
    mice:   [5,7,9,11,13,15,17,19,21],
    nozzle: Array.from({length:19},(_,i)=>i+4),
    shutter:SHUTTER,
  },
  Yuzu:{
    mice:   [6,8,10,12,14,16,18,20,22],
    nozzle: Array.from({length:19},(_,i)=>i+4),
    shutter:SHUTTER,
  },
};

const STATUS_STYLE={
  done:    {bg:"#dcfce7",c:"#166534",rowBg:"#ffffff",rowBdr:"#e2e8f0",label:"Done"},
  overdue: {bg:"#ffedd5",c:"#c2410c",rowBg:"#fff7ed",rowBdr:"#fed7aa",label:"Overdue"},
  missed:  {bg:"#fee2e2",c:"#991b1b",rowBg:"#fff1f2",rowBdr:"#fecdd3",label:"Missed"},
  due:     {bg:"#fef9c3",c:"#854d0e",rowBg:"#fffbeb",rowBdr:"#fde68a",label:"Due now"},
  upcoming:{bg:"#f1f5f9",c:"#64748b",rowBg:"#ffffff",rowBdr:"#e2e8f0",label:"Upcoming"},
};

// ── helpers ──────────────────────────────────────────────────
const dstr=(d=new Date())=>{
  // Use local date string to avoid UTC offset issues
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const fmtH=h=>h===0?"12:00 AM":h<12?`${h}:00 AM`:h===12?"12:00 PM":`${h-12}:00 PM`;
const p2=n=>String(n).padStart(2,"0");
const ckKey=(ds,site,type,hr)=>`${ds}||${site}||${type}||${p2(hr)}`;
const fbPath=(ds,site,type,hr)=>`checks/${ds}/${site}/${type}/h${p2(hr)}`;
const nfKey=(ds,site,type,hr,k)=>`nf|${ds}|${site}|${type}|${p2(hr)}|${k}`;
function loadLastName(){try{return localStorage.getItem("wh_last_name")||"";}catch{return "";}}
function saveLastName(n){try{localStorage.setItem("wh_last_name",n);}catch{}}
function loadNotified(){try{const r=localStorage.getItem("wh_notified_"+dstr());return new Set(r?JSON.parse(r):[]);}catch{return new Set();}}
function saveNotified(s){try{localStorage.setItem("wh_notified_"+dstr(),JSON.stringify([...s]));}catch{}}

// ── state ─────────────────────────────────────────────────────
let now=new Date(), tab="overview", checks={}, dbConnected=false,
    modal=null, nameInput="", lastName=loadLastName(), toasts=[],
    notifPerm=typeof Notification!=="undefined"?Notification.permission:"denied",
    historyDay=null, dbStatus="connecting"; // connecting | online | offline | disabled
const notified=loadNotified();

// ── Firebase listeners ────────────────────────────────────────
if(firebaseReady && db){
  // Timeout: if no connection after 6 seconds, show app anyway
  const connTimeout = setTimeout(()=>{
    if(dbStatus==="connecting"){
      dbStatus="offline";
      render();
    }
  }, 6000);

  db.ref(".info/connected").on("value", snap=>{
    if(snap.val()===true){
      dbConnected=true;
      dbStatus="online";
      clearTimeout(connTimeout);
    } else {
      dbConnected=false;
      if(dbStatus==="online") dbStatus="offline";
    }
    render();
  });

  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-8);
  db.ref("checks").on("value", snapshot=>{
    const data=snapshot.val()||{};
    checks={};
    for(const[ds,sites]of Object.entries(data)){
      // cutoff check using string comparison (YYYY-MM-DD format works)
      if(ds < dstr(cutoff)) continue;
      for(const[site,types]of Object.entries(sites))
        for(const[type,hours]of Object.entries(types))
          for(const[hrKey,entry]of Object.entries(hours))
            checks[ckKey(ds,site,type,parseInt(hrKey.replace("h","")))] = entry;
    }
    dbStatus="online";
    render();
  }, err=>{
    console.warn("DB read error:", err);
    dbStatus="offline";
    render();
  });
} else {
  dbStatus="disabled";
}

// Render immediately (empty state) — don't wait for Firebase
render();

// ── status ────────────────────────────────────────────────────
function getStatus(site,type,hr,ds){
  const key=ckKey(ds,site,type,hr);
  const entry=checks[key];
  const isToday=ds===dstr(now);
  if(entry){
    const logTime=new Date(entry.loggedAt);
    const logMins=logTime.getHours()*60+logTime.getMinutes();
    const minsLate=logMins-hr*60;
    return minsLate>15?{s:"overdue",entry}:{s:"done",entry};
  }
  if(isToday){
    const diff=now.getHours()*60+now.getMinutes()-hr*60;
    if(diff>15)  return{s:"missed",entry:null};
    if(diff>=-10)return{s:"due",   entry:null};
    return{s:"upcoming",entry:null};
  }
  return{s:"missed",entry:null};
}

function getStats(site=null,ds=dstr(now)){
  const sites=site?[site]:SITES;
  let done=0,overdue=0,missed=0,due=0,upcoming=0,total=0;
  sites.forEach(s=>Object.entries(SCH[s]).forEach(([type,hrs])=>hrs.forEach(hr=>{
    total++;
    const{s:st}=getStatus(s,type,hr,ds);
    if(st==="done")done++;
    else if(st==="overdue")overdue++;
    else if(st==="missed")missed++;
    else if(st==="due")due++;
    else upcoming++;
  })));
  return{done,overdue,missed,due,upcoming,total};
}

function badge(s){
  const m=STATUS_STYLE[s]||STATUS_STYLE.upcoming;
  return `<span style="font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;background:${m.bg};color:${m.c}">${m.label}</span>`;
}

function buildTypeRow(site,type,hr,ds){
  const{s,entry}=getStatus(site,type,hr,ds);
  const isToday=ds===dstr(now);
  const canLog=isToday&&s!=="done";
  const m=STATUS_STYLE[s]||STATUS_STYLE.upcoming;
  let sub="";
  if(entry){
    const t=new Date(entry.loggedAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    sub=`<div style="font-size:12px;color:#64748b;margin-top:2px">By ${entry.name} · ${t}${s==="overdue"?' <span style="color:#c2410c">(logged late)</span>':''}</div>`;
  } else if(s==="missed"){
    sub=`<div style="font-size:12px;color:#991b1b;margin-top:2px">Not completed</div>`;
  } else if(s==="due"){
    sub=`<div style="font-size:12px;color:#ca8a04;margin-top:2px">Tap to log now</div>`;
  }
  const logAttr=canLog?`data-log="${site}||${type}||${hr}||${ds}"`:"";
  return `<div ${logAttr}
    style="display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:10px;
    border:1px solid ${m.rowBdr};background:${m.rowBg};
    cursor:${canLog?"pointer":"default"};margin-bottom:6px">
    <div style="flex:1">
      <div style="font-weight:${s==="done"?"400":"500"};font-size:14px;
        color:${s==="done"?"#94a3b8":"#1e293b"}">${CHECK_CFG[type].label}</div>
      ${sub}
    </div>
    ${badge(s)}</div>`;
}

function buildTimeBlocks(site,ds){
  const allHours=new Set();
  Object.values(SCH[site]).forEach(hrs=>hrs.forEach(h=>allHours.add(h)));
  const sortedHours=[...allHours].sort((a,b)=>a-b);
  let html="";
  sortedHours.forEach(hr=>{
    const typesAtHour=Object.keys(SCH[site]).filter(type=>SCH[site][type].includes(hr));
    if(!typesAtHour.length)return;
    const statuses=typesAtHour.map(type=>getStatus(site,type,hr,ds).s);
    const hasMissed=statuses.includes("missed"),hasOverdue=statuses.includes("overdue"),
          hasDue=statuses.includes("due"),allDone=statuses.every(s=>s==="done");
    const hStyle=hasMissed?STATUS_STYLE.missed:hasOverdue?STATUS_STYLE.overdue:hasDue?STATUS_STYLE.due:allDone?STATUS_STYLE.done:{bg:"#f8fafc",c:"#475569",rowBdr:"#e2e8f0"};
    html+=`<div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;background:${hStyle.bg};
        border:1px solid ${hStyle.rowBdr};border-radius:10px 10px 0 0;
        padding:9px 14px;font-size:14px;font-weight:700;color:${hStyle.c}">
        ${fmtH(hr)}
        <span style="font-size:12px;font-weight:400;opacity:0.75">— ${typesAtHour.length} check${typesAtHour.length>1?"s":""}</span>
      </div>
      <div style="border:1px solid ${hStyle.rowBdr};border-top:none;border-radius:0 0 10px 10px;padding:8px 8px 2px;background:#fff">`;
    typesAtHour.forEach(type=>{html+=buildTypeRow(site,type,hr,ds);});
    html+=`</div></div>`;
  });
  return html;
}

function buildOverview(){
  const st=getStats();
  let html=`
  <div style="background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:16px;margin-bottom:14px">
    <div style="font-size:12px;color:#64748b;margin-bottom:10px">Today — ${now.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center">
      <div><div style="font-size:18px;font-weight:600">${st.total}</div><div style="font-size:10px;color:#64748b">Total</div></div>
      <div><div style="font-size:18px;font-weight:600;color:#16a34a">${st.done}</div><div style="font-size:10px;color:#64748b">Done</div></div>
      <div><div style="font-size:18px;font-weight:600;color:#854d0e">${st.due}</div><div style="font-size:10px;color:#64748b">Due</div></div>
      <div><div style="font-size:18px;font-weight:600;color:#991b1b">${st.missed}</div><div style="font-size:10px;color:#64748b">Missed</div></div>
      <div><div style="font-size:18px;font-weight:600;color:#c2410c">${st.overdue}</div><div style="font-size:10px;color:#64748b">Overdue</div></div>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">`;
  SITES.forEach(site=>{
    const s=getStats(site),c=SITE_CFG[site];
    const p=s.total>0?Math.round((s.done/s.total)*100):100;
    const barCol=s.missed>0?"#ef4444":s.overdue>0?"#f97316":c.color;
    const bdrStyle=(s.missed>0||s.overdue>0)?"1.5px solid #fca5a5":"1px solid #e2e8f0";
    html+=`<div data-gotosite="${site}" style="background:#fff;border-radius:14px;
      border:${bdrStyle};padding:12px;cursor:pointer;border-left:4px solid ${c.color}">
      <div style="font-weight:600;font-size:15px;color:${c.color};margin-bottom:6px">${site}</div>
      <div style="height:5px;background:#f1f5f9;border-radius:3px;margin-bottom:8px;overflow:hidden">
        <div style="height:100%;width:${p}%;background:${barCol};border-radius:3px"></div>
      </div>
      <div style="font-size:11px;color:#64748b;line-height:1.8">
        <span style="color:#166534;font-weight:600">${s.done}</span> done
        ${s.due>0?`· <span style="color:#854d0e;font-weight:600">${s.due}</span> due`:""}
        ${s.missed>0?`· <span style="color:#991b1b;font-weight:600">${s.missed}</span> missed`:""}
        ${s.overdue>0?`· <span style="color:#c2410c;font-weight:600">${s.overdue}</span> overdue`:""}
      </div>
    </div>`;
  });
  html+="</div>";
  return html;
}

function buildSite(site){
  const ds=dstr(now),s=getStats(site,ds);
  return `
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:16px;text-align:center">
    <div style="background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:8px 4px">
      <div style="font-size:18px;font-weight:600">${s.total}</div><div style="font-size:10px;color:#64748b">Total</div></div>
    <div style="background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:8px 4px">
      <div style="font-size:18px;font-weight:600;color:#16a34a">${s.done}</div><div style="font-size:10px;color:#64748b">Done</div></div>
    <div style="background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:8px 4px">
      <div style="font-size:18px;font-weight:600;color:#854d0e">${s.due}</div><div style="font-size:10px;color:#64748b">Due</div></div>
    <div style="background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:8px 4px">
      <div style="font-size:18px;font-weight:600;color:#991b1b">${s.missed}</div><div style="font-size:10px;color:#64748b">Missed</div></div>
    <div style="background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:8px 4px">
      <div style="font-size:18px;font-weight:600;color:#c2410c">${s.overdue}</div><div style="font-size:10px;color:#64748b">Overdue</div></div>
  </div>
  ${buildTimeBlocks(site,ds)}`;
}

function buildHistory(){
  let html=`<div style="font-size:13px;color:#64748b;margin-bottom:12px">Past 7 days</div>`;
  for(let i=1;i<=7;i++){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const ds=dstr(d);
    const s=getStats(null,ds);
    const pct=s.total>0?Math.round((s.done/s.total)*100):0;
    const col=pct>=90?"#16a34a":pct>=60?"#d97706":"#dc2626";
    const bar=pct>=90?"#22c55e":pct>=60?"#f59e0b":"#ef4444";
    const lbl=d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
    html+=`<div data-histday="${ds}" style="background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:14px;margin-bottom:10px;cursor:pointer">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-weight:600;font-size:15px">${lbl}</span>
        <span style="font-weight:700;font-size:17px;color:${col}">${pct}%</span>
      </div>
      <div style="height:5px;background:#f1f5f9;border-radius:3px;margin-bottom:10px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${bar};border-radius:3px"></div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
        <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:#dcfce7;color:#166534">${s.done} done</span>
        ${s.missed>0?`<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:#fee2e2;color:#991b1b">${s.missed} missed</span>`:""}
        ${s.overdue>0?`<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:#ffedd5;color:#c2410c">${s.overdue} overdue</span>`:""}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">`;
    SITES.forEach(site=>{
      const sc=getStats(site,ds),c=SITE_CFG[site];
      const sp=sc.total>0?Math.round((sc.done/sc.total)*100):0;
      html+=`<div style="background:${c.bg};border-radius:8px;padding:8px">
        <div style="font-weight:600;font-size:12px;color:${c.color};margin-bottom:3px">${site}</div>
        <div style="font-size:11px;color:${c.color}">${sc.done}/${sc.total} · ${sp}%${sc.missed>0?` · <span style="color:#991b1b">${sc.missed}M</span>`:""}${sc.overdue>0?` · <span style="color:#c2410c">${sc.overdue}OD</span>`:""}</div>
      </div>`;
    });
    html+=`</div><div style="text-align:center;margin-top:10px;font-size:12px;color:#94a3b8">Tap to see full details →</div></div>`;
  }
  return html;
}

function buildHistoryDetail(ds){
  const d=new Date(ds+"T12:00:00");
  const lbl=d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  const s=getStats(null,ds);
  const pct=s.total>0?Math.round((s.done/s.total)*100):0;
  let html=`
  <div id="back-btn" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;
    padding:8px 14px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;
    font-size:13px;font-weight:600;color:#475569;cursor:pointer">← Back</div>
  <div style="background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:14px;margin-bottom:16px">
    <div style="font-weight:700;font-size:16px;margin-bottom:8px">${lbl}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      <span style="font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:#dcfce7;color:#166534">${s.done} done</span>
      ${s.missed>0?`<span style="font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:#fee2e2;color:#991b1b">${s.missed} missed</span>`:""}
      ${s.overdue>0?`<span style="font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:#ffedd5;color:#c2410c">${s.overdue} overdue</span>`:""}
      <span style="font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:#f1f5f9;color:#475569">${pct}% complete</span>
    </div>
  </div>`;
  SITES.forEach(site=>{
    const c=SITE_CFG[site],sc=getStats(site,ds);
    const sp=sc.total>0?Math.round((sc.done/sc.total)*100):0;
    html+=`<div style="margin-bottom:24px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-size:16px;font-weight:700;color:${c.color}">${site}</div>
        <div style="display:flex;gap:4px">
          <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:${c.bg};color:${c.color}">${sp}%</span>
          ${sc.missed>0?`<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:#fee2e2;color:#991b1b">${sc.missed}M</span>`:""}
          ${sc.overdue>0?`<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:#ffedd5;color:#c2410c">${sc.overdue}OD</span>`:""}
        </div>
      </div>
      ${buildTimeBlocks(site,ds)}
    </div>`;
  });
  return html;
}

function buildModal(){
  if(!modal)return"";
  const{site,type,hr,ds}=modal,c=SITE_CFG[site];
  return `<div id="overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;z-index:200">
    <div style="background:#fff;border-radius:20px 20px 0 0;padding:22px 20px 36px;width:100%;max-width:430px;margin:0 auto">
      <div style="width:38px;height:4px;background:#e2e8f0;border-radius:2px;margin:0 auto 18px"></div>
      <div style="font-weight:700;font-size:18px;margin-bottom:5px">Log check</div>
      <div style="font-size:13px;color:#64748b;background:#f8fafc;border-radius:10px;padding:9px 13px;margin-bottom:20px">
        <span style="color:${c.color};font-weight:600">${site}</span> &mdash; ${CHECK_CFG[type].label} &mdash; ${fmtH(hr)}</div>
      <label style="display:block;font-weight:600;font-size:13px;margin-bottom:7px;color:#64748b">Your name</label>
      <input id="name-input" value="${nameInput.replace(/"/g,"&quot;")}" placeholder="Enter your name"
        autocomplete="name" autocapitalize="words"
        style="width:100%;padding:12px 14px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:16px;color:#1e293b;background:#fff;outline:none;margin-bottom:16px"/>
      <div style="display:flex;gap:10px">
        <button id="cancel-btn" style="flex:1;padding:13px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;font-size:14px;color:#64748b">Cancel</button>
        <button id="confirm-btn" style="flex:2;padding:13px;border-radius:10px;border:none;background:${nameInput.trim()?"#185FA5":"#94a3b8"};color:#fff;font-size:15px;font-weight:600">Confirm check</button>
      </div></div></div>`;
}

function buildToasts(){
  if(!toasts.length)return"";
  const cm={ok:"#f0fdf4|#166534|#bbf7d0",warn:"#fffbeb|#854d0e|#fde68a",danger:"#fff1f2|#991b1b|#fecdd3"};
  return `<div style="padding:0 16px 8px">${toasts.map(t=>{const[bg,co,bd]=(cm[t.kind]||cm.ok).split("|");return`<div style="background:${bg};border:1px solid ${bd};color:${co};border-radius:10px;padding:11px 14px;font-size:13px;font-weight:600;margin-bottom:6px">${t.msg}</div>`;}).join("")}</div>`;
}

function render(){
  const app=document.getElementById("app");if(!app)return;
  const tabs2=["overview",...SITES,"history"],
        tlbls={overview:"Overview",history:"History",...Object.fromEntries(SITES.map(s=>[s,s]))};
  const tabsHtml=tabs2.map(t=>{
    const act=tab===t,c=SITE_CFG[t];
    return `<button data-tab="${t}" style="padding:7px 13px;border-radius:20px;font-size:13px;font-weight:${act?600:400};border:${act?(c?`1.5px solid ${c.color}`:"1.5px solid #334155"):"1px solid #e2e8f0"};background:${act?(c?c.bg:"#f1f5f9"):"#fff"};color:${act?(c?c.color:"#1e293b"):"#64748b"};white-space:nowrap;flex-shrink:0">${tlbls[t]}</button>`;
  }).join("");

  const dotCol=dbStatus==="online"?"#22c55e":dbStatus==="connecting"?"#f59e0b":"#ef4444";
  const dotTxt=dbStatus==="online"?"Live sync on":dbStatus==="connecting"?"Connecting…":"Sync offline";
  const connDot=`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dotCol};margin-right:5px"></span>`;

  const notifBar=notifPerm!=="granted"?`<div id="notif-bar" style="background:#fef9c3;border:1px solid #fde68a;border-radius:10px;padding:8px 12px;font-size:12px;color:#854d0e;cursor:pointer;margin-bottom:10px;font-weight:500">Tap here to enable notifications for check reminders</div>`:"";

  const offlineBanner=dbStatus==="offline"?`<div style="background:#fff1f2;border:1px solid #fecdd3;border-radius:10px;padding:8px 12px;font-size:12px;color:#991b1b;margin-bottom:10px;font-weight:500">No database connection — checks cannot be saved or synced. Please check your internet connection.</div>`:"";

  let content="";
  if(tab==="overview")content=buildOverview();
  else if(SITES.includes(tab))content=buildSite(tab);
  else content=historyDay?buildHistoryDetail(historyDay):buildHistory();

  app.innerHTML=`
  <div style="background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 16px 10px;position:sticky;top:0;z-index:50">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
      <div>
        <div style="font-size:17px;font-weight:700;color:#1e293b">Warehouse Checks</div>
        <div style="font-size:12px;color:#64748b;margin-top:2px">${connDot}${dotTxt} &nbsp;·&nbsp; ${now.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div>
      </div>
      <div style="background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;padding:7px 13px;text-align:center">
        <div style="font-size:19px;font-weight:700;letter-spacing:-0.5px;color:#1e293b">${now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>
      </div>
    </div>
    ${offlineBanner}${notifBar}
    <div class="scroll-x">${tabsHtml}</div>
  </div>
  <div style="padding:16px">${content}</div>
  ${buildToasts()}${buildModal()}`;

  app.querySelectorAll("[data-tab]").forEach(el=>el.addEventListener("click",()=>{tab=el.dataset.tab;historyDay=null;render();}));
  app.querySelectorAll("[data-log]").forEach(el=>el.addEventListener("click",()=>{
    const[site,type,hr,ds]=el.dataset.log.split("||");
    modal={site,type,hr:parseInt(hr),ds};nameInput=lastName;render();
    setTimeout(()=>{const inp=document.getElementById("name-input");if(inp){inp.focus();inp.select();}},80);
  }));
  app.querySelectorAll("[data-gotosite]").forEach(el=>el.addEventListener("click",()=>{tab=el.dataset.gotosite;render();}));
  app.querySelectorAll("[data-histday]").forEach(el=>el.addEventListener("click",()=>{historyDay=el.dataset.histday;render();}));
  const backBtn=document.getElementById("back-btn");
  if(backBtn)backBtn.addEventListener("click",()=>{historyDay=null;render();});
  const ni=document.getElementById("name-input");
  if(ni){
    ni.addEventListener("input",e=>{nameInput=e.target.value;const cb=document.getElementById("confirm-btn");if(cb)cb.style.background=nameInput.trim()?"#185FA5":"#94a3b8";});
    ni.addEventListener("keydown",e=>{if(e.key==="Enter")confirmLog();});
  }
  const cfb=document.getElementById("confirm-btn");if(cfb)cfb.addEventListener("click",confirmLog);
  const ccb=document.getElementById("cancel-btn");if(ccb)ccb.addEventListener("click",()=>{modal=null;render();});
  const ov=document.getElementById("overlay");if(ov)ov.addEventListener("click",e=>{if(e.target===ov){modal=null;render();}});
  const nb=document.getElementById("notif-bar");if(nb)nb.addEventListener("click",()=>{if(typeof Notification!=="undefined")Notification.requestPermission().then(p=>{notifPerm=p;render();});});
}

async function confirmLog(){
  if(!modal||!nameInput.trim())return;
  if(!firebaseReady||!db){addToast("Cannot save — no database connection","danger",6000);return;}
  const{site,type,hr,ds}=modal,entry={name:nameInput.trim(),loggedAt:new Date().toISOString()};
  try{
    await db.ref(fbPath(ds,site,type,hr)).set(entry);
    saveLastName(nameInput.trim());lastName=nameInput.trim();modal=null;nameInput="";
  } catch(e){addToast("Could not save — check your connection","danger",6000);}
}

function addToast(msg,kind,ms=8000){
  const id=Date.now()+Math.random();
  toasts=[...toasts.slice(-2),{id,msg,kind}];render();
  setTimeout(()=>{toasts=toasts.filter(t=>t.id!==id);render();},ms);
}

function checkAlerts(){
  const h=now.getHours(),m=now.getMinutes(),ds=dstr(now);
  const push=(title,body,kind)=>{addToast(body,kind,10000);if(notifPerm==="granted"){try{new Notification(title,{body});}catch{}}};
  if(m===50){const dh=h+1;SITES.forEach(site=>Object.entries(SCH[site]).forEach(([type,hrs])=>{
    if(hrs.includes(dh)){const nk=nfKey(ds,site,type,dh,"pre"),ck=ckKey(ds,site,type,dh);
      if(!notified.has(nk)&&!checks[ck]){notified.add(nk);saveNotified(notified);push("Check due soon",`${site} — ${CHECK_CFG[type].label} due at ${fmtH(dh)}`,"warn");}}
  )));}
  if(m===15){SITES.forEach(site=>Object.entries(SCH[site]).forEach(([type,hrs])=>{
    if(hrs.includes(h)){const nk=nfKey(ds,site,type,h,"late"),ck=ckKey(ds,site,type,h);
      if(!notified.has(nk)&&!checks[ck]){notified.add(nk);saveNotified(notified);push("Check missed!",`${site} — ${CHECK_CFG[type].label} at ${fmtH(h)} was not completed`,"danger");}}
  )));}
}

setInterval(()=>{now=new Date();checkAlerts();render();},60000);
</script>
</body>
</html>
